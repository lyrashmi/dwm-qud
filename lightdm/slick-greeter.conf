[Greeter]
# ── Background ───────────────────────────────────────────
# Wallpaper installed by 'sudo make install'
background=/usr/share/pixmaps/dwm-titus.jpg
# Nord dark fallback shown while wallpaper loads
background-color=#0f3b3a
# Span wallpaper across all monitors instead of repeating
stretch-background-across-monitors=true
# Subtle dot-grid overlay for depth
draw-grid=true
# Don't replace wallpaper with per-user images
draw-user-backgrounds=false

# ── Logo ─────────────────────────────────────────────────
logo=/usr/share/pixmaps/dwm-titus-logo.png

# ── Login panel ──────────────────────────────────────────
# Centre the login box on screen
content-align=center
theme-name=Dwm-qud
icon-theme-name=Qud-Icons
cursor-theme-name=Capitaine-Cursors-White
cursor-theme-size=48

# ── Font & rendering ─────────────────────────────────────
# Uses Source Code Pro (installed through the Fedora font package profile)
font-name=Source Code Pro 12
xft-antialias=true
xft-hintstyle=hintslight
xft-rgba=rgb
xft-dpi=96

# ── Clock ────────────────────────────────────────────────
show-clock=true
clock-format=%a, %b %d   %H:%M

# ── Panel items ──────────────────────────────────────────
# Session chooser reads /usr/share/xsessions automatically
show-hostname=true
show-power=true
show-a11y=false
show-keyboard=false
show-quit=true

# ── Misc ─────────────────────────────────────────────────
enable-hidpi=auto
# Keep this disabled by default so the greeter does not depend on numlockx.
activate-numlock=false
